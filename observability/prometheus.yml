global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: flink
    static_configs:
      - targets: ["jobmanager:9249", "taskmanager:9249"]
  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
  - job_name: connect
    static_configs:
      - targets: ["connect:9404"]
  - job_name: controller
    static_configs:
      - targets: ["controller:8001"]
  - job_name: lakehouse
    static_configs:
      - targets: ["exporter:8000", "maintenance:8002"]
