groups:
  - name: cdc
    rules:
      - alert: FreshnessHigh
        expr: lakehouse_freshness_seconds{table="debezium_heartbeat"} > 300
        for: 2m
        annotations:
          summary: "Iceberg is more than 5 minutes behind Postgres (heartbeat canary)"
      - alert: ReplicationSlotLagHigh
        expr: max(pg_replication_slots_slot_current_wal_lsn - pg_replication_slots_slot_confirmed_flush_lsn) > 1073741824
        for: 5m
        annotations:
          summary: "Slot debezium retains more than 1 GB of WAL; max_slot_wal_keep_size is 4 GB"
      - alert: CheckpointsFailing
        expr: increase(flink_jobmanager_job_numberOfFailedCheckpoints[10m]) > 2
        annotations:
          summary: "Flink checkpoints are failing; Iceberg commits are stalled"
      - alert: CdcJobDown
        expr: cdc_controller_job_running == 0
        for: 2m
      - alert: PipelineHalted
        expr: max(cdc_controller_halted) > 0
        annotations:
          summary: "A table waits for an operator decision (make schema-resolve)"
      - alert: ConnectorFailed
        expr: max(cdc_controller_connector_failed) > 0
        for: 2m
      - alert: DeadLetters
        expr: sum(increase(flink_taskmanager_job_task_operator_table_dlq[15m])) > 0
      - alert: SuspectGuardDrop
        expr: sum(flink_taskmanager_job_task_operator_table_suspect_dropped) > 0
        annotations:
          summary: "The ordering guard dropped an event newer than the applied row"
